name: CanaryNorth security checks

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: contextseal
          POSTGRES_PASSWORD: contextseal-ci
          POSTGRES_DB: contextseal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contextseal -d contextseal_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://contextseal:contextseal-ci@127.0.0.1:5432/contextseal_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run release:verify
      - run: npm run lint
      - run: npm audit --audit-level=high
